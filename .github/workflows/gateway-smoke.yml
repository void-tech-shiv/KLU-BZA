name: Check live ERP gateway
on:
  workflow_dispatch:
  push:
    branches:
      - fix/erp-captcha-autoload
    paths:
      - backend/**
      - .github/workflows/gateway-smoke.yml
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check health and public CAPTCHA flow without credentials
        env:
          GATEWAY_URL: https://klu-bza-student-gateway.onrender.com
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          base = os.environ['GATEWAY_URL'].rstrip('/')
          def request(path, *, method='GET', data=None):
              req = urllib.request.Request(base + path, data=data, method=method,
                  headers={'Content-Type': 'application/json', 'User-Agent': 'KLU-BZA-CI-Smoke/1.0'})
              with urllib.request.urlopen(req, timeout=80) as response:
                  return response.status, json.load(response)

          for attempt in range(12):
              try:
                  code, body = request('/health')
                  if code == 200 and body.get('status') == 'ok':
                      print('Live Render /health: OK')
                      break
              except (urllib.error.URLError, TimeoutError, ValueError):
                  pass
              if attempt == 11:
                  raise SystemExit('Live Render health check failed. Inspect Render deploy/logs.')
              time.sleep(10)

          try:
              code, body = request('/api/challenge', method='POST', data=b'{}')
              image = base64.b64decode(body.get('captcha', ''), validate=True)
              if code != 200 or not body.get('token') or not (
                  image.startswith((b'\\x89PNG\\r\\n\\x1a\\n', b'\\xff\\xd8\\xff', b'GIF87a', b'GIF89a'))
                  or (image[:4] == b'RIFF' and image[8:12] == b'WEBP')
              ):
                  raise ValueError('CAPTCHA response is invalid')
              print('Live ERP CAPTCHA endpoint: OK (contents omitted)')
          except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError, ValueError, KeyError) as exc:
              code = exc.code if isinstance(exc, urllib.error.HTTPError) else 'unknown'
              raise SystemExit(f'CAPTCHA integration failed (HTTP {code}); inspect upstream ERP compatibility. No credentials were used.')
          PY
