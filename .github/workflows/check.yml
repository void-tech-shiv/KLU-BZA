name: Test and build Android + web
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest backend/tests -q
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true
      - run: python scripts/bootstrap.py
      - run: flutter pub get
        working-directory: client
      - run: flutter test
        working-directory: client
      - run: flutter build web --dart-define=API_BASE_URL="$API_BASE_URL"
        working-directory: client
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://klu-bza-student-gateway.onrender.com' }}
      - run: flutter build apk --debug --dart-define=API_BASE_URL="$API_BASE_URL"
        working-directory: client
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://klu-bza-student-gateway.onrender.com' }}
      - uses: actions/upload-artifact@v4
        with:
          name: klu-bza-web
          path: client/build/web
      - uses: actions/upload-artifact@v4
        with:
          name: klu-bza-android-debug
          path: client/build/app/outputs/flutter-apk/app-debug.apk
